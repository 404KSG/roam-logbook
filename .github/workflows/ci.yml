name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CHROME_BIN: /usr/bin/chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Chromium for required layout tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes chromium
          test -x "$CHROME_BIN"
      - run: npm ci
      - run: npm run check
      - run: npm run verify:bundle
