name: CI

on:
  push:
  pull_request:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint 1.7.7
        # The pinned Docker image executes the real actionlint binary in CI.
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
  workflow-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify CI workflow contract
        run: node scripts/verify-workflow.mjs
  verify:
    runs-on: ubuntu-latest
    env:
      CHROME_BIN: /usr/bin/chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Chromium for required layout tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes chromium
          test -x "$CHROME_BIN"
      - run: npm ci
      - run: npm run verify:workflow
      - run: npm run lint
      - run: npm test
      - run: npm run verify:bundle
